name: 🐞 Report an Intel macOS bug
description: Report a problem with the ImageGlass Intel Mac community build.
labels: ['🐞 bug']
body:
- type: markdown
  attributes:
    value: |
      Search open and closed issues before reporting.
      For security problems, use the [private vulnerability form](https://github.com/FarMC666/ImageGlass-macOS/security/advisories/new).

- type: input
  id: os-version
  attributes:
    label: macOS version
    description: Use the version from About This Mac or Help > About in ImageGlass.
    placeholder: macOS 15.8.3
  validations:
    required: true

- type: input
  id: ig-version
  attributes:
    label: Intel release tag
    description: Use Help > About > Copy Build Info, or find the tag on the GitHub release you downloaded.
    placeholder: 10.0.6.906-mac-x64.3
  validations:
    required: true

- type: dropdown
  id: ig-release
  attributes:
    label: ImageGlass edition
    options:
      - Classic
      - Pro
      - Unknown
  validations:
    required: true

- type: textarea
  id: reproduction-steps
  attributes:
    label: 1️⃣ Steps to reproduce
    placeholder: |
      1. Go to...
      2. Click on...
      3. Scroll down to...
      4. See error when...
  validations:
    required: true

- type: textarea
  id: actual-behavior
  attributes:
    label: 2️⃣ Actual behavior
    description: Use list bullets to make it clear and concise.
  validations:
    required: true

- type: textarea
  id: expected-behavior
  attributes:
    label: 3️⃣ Expected behavior
    description: A clear and concise description of what you expected to happen.
  validations:
    required: true

- type: textarea
  id: media
  attributes:
    label: 4️⃣ Screenshots / Video / Sample image file
    description: |
      - ✅ Do attach SCREENSHOTS, VIDEO to help explain your problem quickly.
      - ✅ Do attach a SAMPLE FILE if the problem involves image formats.
      
- type: textarea
  id: additional-context
  attributes:
    label: 5️⃣ Additional context
    description: Add any other context about the problem here.
